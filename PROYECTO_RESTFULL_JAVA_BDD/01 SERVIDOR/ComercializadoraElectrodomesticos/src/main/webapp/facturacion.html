<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación - Comercializadora</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .productos-list {
            margin: 30px 0;
        }
        
        .producto-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }
        
        .producto-item input[type="checkbox"] {
            width: 20px;
            margin-right: 15px;
        }
        
        .producto-item input[type="number"] {
            width: 80px;
            margin-left: auto;
        }
        
        .producto-info {
            flex: 1;
        }
        
        .producto-nombre {
            font-weight: bold;
            color: #333;
        }
        
        .producto-precio {
            color: #667eea;
            font-weight: bold;
        }
        
        .forma-pago {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        
        .forma-pago label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        
        .forma-pago input[type="radio"] {
            width: auto;
            margin-right: 8px;
        }
        
        .cuotas-container {
            display: none;
        }
        
        .total {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
            text-align: right;
        }
        
        .total h3 {
            color: #667eea;
            font-size: 1.5em;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }
        
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            display: none;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💳 Sistema de Facturación</h1>
        
        <div id="alert" class="alert"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Procesando...</p>
        </div>
        
        <form id="facturaForm">
            <div class="form-group">
                <label>Cédula del Cliente:</label>
                <input type="text" id="cedula" required maxlength="10" pattern="[0-9]{10}">
            </div>
            
            <div class="form-group">
                <label>Nombre del Cliente:</label>
                <input type="text" id="nombreCliente" required>
            </div>
            
            <h3 style="margin: 30px 0 20px;">Seleccione los Productos:</h3>
            <div id="productosContainer" class="productos-list">
                <!-- Se cargan dinámicamente -->
            </div>
            
            <div class="total">
                <h3>Total: $<span id="totalAmount">0.00</span></h3>
            </div>
            
            <h3 style="margin: 30px 0 20px;">Forma de Pago:</h3>
            <div class="forma-pago">
                <label>
                    <input type="radio" name="formaPago" value="EFECTIVO" checked>
                    Efectivo (33% descuento)
                </label>
                <label>
                    <input type="radio" name="formaPago" value="CREDITO">
                    Crédito Directo
                </label>
            </div>
            
            <div id="cuotasContainer" class="cuotas-container form-group">
                <label>Número de Cuotas (3-24):</label>
                <input type="number" id="numeroCuotas" min="3" max="24" value="12">
            </div>
            
            <div style="margin-top: 30px;">
                <button type="submit" class="btn btn-primary">Procesar Venta</button>
                <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">Cancelar</button>
            </div>
        </form>
    </div>
    
    <script>
        let productos = [];
        
        // Cargar productos al iniciar
        async function cargarProductos() {
            try {
                const response = await fetch('/ComercializadoraElectrodomesticos/api/electrodomesticos');
                productos = await response.json();
                mostrarProductos();
            } catch (error) {
                mostrarAlerta('Error al cargar productos: ' + error.message, 'error');
            }
        }
        
        // Mostrar productos en la lista
        function mostrarProductos() {
            const container = document.getElementById('productosContainer');
            container.innerHTML = productos.map(p => `
                <div class="producto-item">
                    <input type="checkbox" data-id="${p.idElectrodomestico}" 
                           data-precio="${p.precioVenta}" onchange="calcularTotal()">
                    <div class="producto-info">
                        <div class="producto-nombre">${p.nombre}</div>
                        <div>${p.marca} - ${p.descripcion}</div>
                        <div class="producto-precio">$${p.precioVenta.toFixed(2)}</div>
                    </div>
                    <input type="number" min="1" value="1" class="cantidad" 
                           data-id="${p.idElectrodomestico}" onchange="calcularTotal()">
                </div>
            `).join('');
        }
        
        // Calcular total
        function calcularTotal() {
            let subtotal = 0;
            document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                const precio = parseFloat(cb.dataset.precio);
                const cantidad = parseInt(document.querySelector(`.cantidad[data-id="${cb.dataset.id}"]`).value);
                subtotal += precio * cantidad;
            });
            
            const formaPago = document.querySelector('input[name="formaPago"]:checked').value;
            let total = subtotal;
            
            if (formaPago === 'EFECTIVO') {
                total = subtotal * 0.67; // 33% descuento
            }
            
            document.getElementById('totalAmount').textContent = total.toFixed(2);
        }
        
        // Cambiar forma de pago
        document.querySelectorAll('input[name="formaPago"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const cuotasContainer = document.getElementById('cuotasContainer');
                if (this.value === 'CREDITO') {
                    cuotasContainer.style.display = 'block';
                } else {
                    cuotasContainer.style.display = 'none';
                }
                calcularTotal();
            });
        });
        
        // Procesar venta
        document.getElementById('facturaForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const cedula = document.getElementById('cedula').value;
            const nombreCliente = document.getElementById('nombreCliente').value;
            const formaPago = document.querySelector('input[name="formaPago"]:checked').value;
            
            // Obtener items seleccionados
            const items = [];
            document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                const id = parseInt(cb.dataset.id);
                const cantidad = parseInt(document.querySelector(`.cantidad[data-id="${id}"]`).value);
                const producto = productos.find(p => p.idElectrodomestico === id);
                
                items.push({
                    idElectrodomestico: id,
                    cantidad: cantidad,
                    precio: producto.precioVenta
                });
            });
            
            if (items.length === 0) {
                mostrarAlerta('Debe seleccionar al menos un producto', 'error');
                return;
            }
            
            mostrarCargando(true);
            
            try {
                let url, data;
                
                if (formaPago === 'EFECTIVO') {
                    url = '/ComercializadoraElectrodomesticos/api/facturacion/venta-efectivo';
                    data = { cedula, nombreCliente, items };
                } else {
                    const numeroCuotas = parseInt(document.getElementById('numeroCuotas').value);
                    url = '/ComercializadoraElectrodomesticos/api/facturacion/venta-credito';
                    data = { cedula, nombreCliente, items, numeroCuotas };
                }
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const resultado = await response.json();
                
                if (resultado.exito) {
                    let mensaje = `✅ ${resultado.mensaje}\nFactura #${resultado.idFactura}`;
                    if (formaPago === 'CREDITO') {
                        mensaje += `\nCuota Mensual: $${resultado.cuotaMensual.toFixed(2)}`;
                    }
                    mostrarAlerta(mensaje, 'success');
                    document.getElementById('facturaForm').reset();
                    calcularTotal();
                } else {
                    mostrarAlerta('❌ ' + resultado.mensaje, 'error');
                }
            } catch (error) {
                mostrarAlerta('Error al procesar venta: ' + error.message, 'error');
            } finally {
                mostrarCargando(false);
            }
        });
        
        function mostrarAlerta(mensaje, tipo) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${tipo === 'error' ? 'error' : 'success'}`;
            alert.textContent = mensaje;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
        
        function mostrarCargando(mostrar) {
            document.getElementById('loading').style.display = mostrar ? 'block' : 'none';
        }
        
        // Inicializar
        cargarProductos();
    </script>
</body>
</html>
